<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Flashcard App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Premium Feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Tone.js & VexFlow for Music Notation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --grid-line: #475569;
            --string-color: #94a3b8;
            --active-cell: #f472b6;
            --success: #4ade80;
            --error: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            height: 100vh;
            padding: 0;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: row;
            height: 100%;
            gap: 0;
        }

        .left-panel {
            width: 450px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            overflow-y: auto;
            justify-content: center;
            border-right: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
        }

        header h1 {
            font-weight: 600;
            font-size: 1.8rem;
            background: linear-gradient(to right, var(--accent-color), #a855f7);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.2rem;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-color);
            opacity: 0.8;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .staff-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        #vexflow-output {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .feedback-container {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 400;
            min-height: 1.5em;
        }

        .fingerboard-layout {
            display: flex;
            flex: 1;
            gap: 1rem;
            overflow: hidden;
            padding: 1rem;
            height: 100%;
        }

        .fingerboard-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: var(--accent-color) var(--bg-color);
        }

        .fingerboard-grid {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            gap: 10px;
            padding-bottom: 2rem;
        }

        .string-column {
            width: 76px;
            flex-shrink: 0;
        }

        .legend {
            width: 140px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.5rem;
            font-size: 0.8rem;
            border-left: 1px solid var(--grid-line);
            overflow-y: auto;
        }

        .legend h3 {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .legend ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .legend li {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .cell {
            width: 100%;
            height: 42px;
            flex-shrink: 0;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .cell-content {
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .cell-markers {
            position: absolute;
            right: 4px;
            top: 2px;
            bottom: 2px;
            width: 6px;
            display: flex;
            flex-direction: column;
            gap: 1px;
            justify-content: center;
        }

        .pos-marker {
            width: 100%;
            flex: 1;
            border-radius: 2px;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        }

        .octave-dot {
            position: absolute;
            left: 4px;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        .cell:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .cell.active {
            background-color: var(--active-cell) !important;
            box-shadow: 0 0 10px var(--active-cell);
        }

        .cell.correct {
            background-color: var(--success) !important;
            box-shadow: 0 0 10px var(--success);
        }

        .string-row {
            display: contents;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            flex-wrap: wrap;
        }

        .mode-toggles {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            padding: 2px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: white;
        }

        .quiz-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .controls-options {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding-bottom: 0.5rem;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
        }

        .toggle-label input {
            accent-color: var(--accent-color);
            width: 1.2rem;
            height: 1.2rem;
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--accent-color), #2563eb);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .primary-btn.running {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }

        .primary-btn:active {
            transform: translateY(0);
        }

        .secondary-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media screen and (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
            }

            .app-container {
                flex-direction: column;
                height: auto;
            }

            .left-panel {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                overflow: visible;
                height: auto;
            }

            .left-panel header {
                order: 0;
            }

            .left-panel .controls {
                order: 1;
                justify-content: center;
                flex-wrap: wrap;
            }

            .left-panel .controls-options {
                order: 2;
            }

            .left-panel .staff-container {
                order: 3;
                margin-bottom: 1rem;
            }

            .left-panel .feedback-container {
                order: 4;
            }

            .fingerboard-layout {
                overflow: visible;
                flex-direction: column;
                height: auto;
            }

            .fingerboard-container {
                overflow: visible;
            }

            .fingerboard-grid {
                justify-content: center;
            }

            .legend {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--grid-line);
                flex-direction: row;
                overflow-x: auto;
                justify-content: center;
            }

            .legend ul {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="left-panel">
            <header>
                <h1>Cello Notes</h1>
                <p id="instruction-text">Play the note shown on the staff, then listen to check.</p>
            </header>

            <section class="staff-container glass-panel">
                <div id="vexflow-output"></div>
            </section>

            <section class="feedback-container">
                <div id="feedback-msg">Click "Start Quiz" to begin</div>
            </section>

            <div class="controls">
                <div class="mode-toggles">
                    <button id="quiz-mode-btn" class="mode-btn active">Quiz Mode</button>
                    <button id="explore-mode-btn" class="mode-btn">Explore Mode</button>
                </div>
                <div class="quiz-actions" id="quiz-actions">
                    <button id="start-pause-btn" class="primary-btn">Start Quiz</button>
                    <button id="next-btn" class="secondary-btn" title="Skip to next note">Next</button>
                </div>
            </div>

            <div class="controls-options">
                <label class="toggle-label"><input type="checkbox" id="treble-toggle"> Treble Clef</label>
                <label class="toggle-label"><input type="checkbox" id="tenor-toggle"> Tenor Clef</label>
            </div>
        </div>

        <section class="fingerboard-layout glass-panel">
            <div class="fingerboard-container" id="fingerboard-scroll">
                <div class="fingerboard-grid" id="fingerboard">
                    <!-- Grid generated by JS -->
                </div>
            </div>
            <aside class="legend">
                <h3>Positions</h3>
                <ul>
                    <li><span class="dot" style="background-color: #00FFFF"></span> ½ Half</li>
                    <li><span class="dot" style="background-color: #00FF00"></span> I First</li>
                    <li><span class="dot" style="background-color: #FFFF00"></span> Up I / Lo II</li>
                    <li><span class="dot" style="background-color: #FFA500"></span> II Second</li>
                    <li><span class="dot" style="background-color: #FF00FF"></span> III Third</li>
                    <li><span class="dot" style="background-color: #FF1493"></span> Up III</li>
                    <li><span class="dot" style="background-color: #00BFFF"></span> IV Fourth</li>
                    <li><span class="dot" style="background-color: #ADFF2F"></span> Up IV</li>
                    <li><span class="dot" style="background-color: #FF4500"></span> V Fifth</li>
                    <li><span class="dot" style="background-color: #FF8C00"></span> VI Sixth</li>
                    <li><span class="dot" style="background-color: #9400D3"></span> VII Seventh</li>
                </ul>
            </aside>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
