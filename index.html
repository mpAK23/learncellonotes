<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Flashcard App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Premium Feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Tone.js & VexFlow for Music Notation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
</head>

<body>
    <div class="app-container">
        <div class="left-panel">
            <header>
                <h1>Cello Notes</h1>
                <p id="instruction-text">Play the note shown on the staff, then listen to check.</p>
            </header>

            <section class="staff-container glass-panel">
                <div id="vexflow-output"></div>
            </section>

            <section class="feedback-container">
                <div id="feedback-msg">Click "Start Quiz" to begin</div>
            </section>

            <div class="controls">
                <div class="mode-toggles">
                    <button id="quiz-mode-btn" class="mode-btn active">Quiz Mode</button>
                    <button id="explore-mode-btn" class="mode-btn">Explore Mode</button>
                </div>
                <div class="quiz-actions" id="quiz-actions">
                    <button id="start-pause-btn" class="primary-btn">Start Quiz</button>
                    <button id="next-btn" class="secondary-btn" title="Skip to next note">Next</button>
                </div>
            </div>

            <div class="controls-options">
                <label class="toggle-label"><input type="checkbox" id="treble-toggle"> Treble Clef</label>
                <label class="toggle-label"><input type="checkbox" id="tenor-toggle"> Tenor Clef</label>
            </div>
        </div>

        <section class="fingerboard-layout glass-panel">
            <div class="fingerboard-container" id="fingerboard-scroll">
                <div class="fingerboard-grid" id="fingerboard">
                    <!-- Grid generated by JS -->
                </div>
            </div>
            <aside class="legend">
                <h3>Positions</h3>
                <ul>
                    <li><span class="dot pos-1"></span> 1st Pos (I)</li>
                    <li><span class="dot pos-2"></span> 2nd Pos (II)</li>
                    <li><span class="dot pos-3"></span> 3rd Pos (III)</li>
                    <li><span class="dot pos-4"></span> 4th Pos (IV)</li>
                    <li><span class="dot pos-thumb"></span> Thumb Pos</li>
                </ul>
            </aside>
        </section>
    </div>

    <script src="app.js" type="module"></script>
</body>

</html>
